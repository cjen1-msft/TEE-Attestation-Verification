version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      - "Cargo.lock"
    cooldown:
      default-days: 5
    groups:
      # The curve crates exchange RustCrypto key and signature types.
      elliptic-curves:
        patterns:
          - "ecdsa"
          - "p256"
          - "p384"
          - "p521"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
