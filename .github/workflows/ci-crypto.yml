name: "Crypto CI"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native-openssl:
    name: Native OpenSSL backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build with OpenSSL backend
        run: cargo build --manifest-path crypto/Cargo.toml --no-default-features --features "crypto_openssl"

      - name: Test with OpenSSL backend
        run: cargo test --manifest-path crypto/Cargo.toml --no-default-features --features "crypto_openssl" -- --nocapture

  native-pure-rust:
    name: Native pure-Rust backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build with pure-Rust backend
        run: cargo build --manifest-path crypto/Cargo.toml --no-default-features --features "crypto_pure_rust"

      - name: Test with pure-Rust backend
        run: cargo test --manifest-path crypto/Cargo.toml --no-default-features --features "crypto_pure_rust" -- --nocapture

  wasm-webcrypto:
    name: WASM WebCrypto backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Check WebCrypto backend
        run: cargo check --manifest-path crypto/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "crypto_webcrypto"

      - name: Test WebCrypto backend
        working-directory: crypto
        run: wasm-pack test --node --no-default-features --features "crypto_webcrypto"

  wasm-pure-rust:
    name: WASM Pure Rust backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Check Pure Rust backend
        run: cargo check --manifest-path crypto/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "crypto_pure_rust"

      - name: Test Pure Rust backend
        working-directory: crypto
        run: wasm-pack test --node --no-default-features --features "crypto_pure_rust"

  coverage:
    name: Crypto test coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install rust
        run: |
          rustup update stable && rustup default stable
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Collect coverage data (OpenSSL backend)
        run: |
          cargo llvm-cov -p tee-attestation-verification-crypto --no-default-features --features "crypto_openssl" \
            --no-report

      - name: Collect coverage and combine LCOV report (pure-Rust backend)
        run: |
          # --no-clean preserves the OpenSSL profile data so the report
          # summarizes coverage across both native backend test runs.
          cargo llvm-cov -p tee-attestation-verification-crypto --no-default-features --features "crypto_pure_rust" \
            --no-clean --lcov --output-path crypto-lcov-combined.info \
            --ignore-filename-regex '(^|/)(test_data|tests)\b'

      - name: Generate combined coverage summary
        run: |
          cargo llvm-cov report --summary-only \
            -p tee-attestation-verification-crypto \
            --ignore-filename-regex '(^|/)(test_data|tests)\b' \
            | tee crypto-coverage-summary.txt
          line_coverage=$(awk '/^TOTAL/ { print $10 }' crypto-coverage-summary.txt)
          region_coverage=$(awk '/^TOTAL/ { print $4 }' crypto-coverage-summary.txt)
          function_coverage=$(awk '/^TOTAL/ { print $7 }' crypto-coverage-summary.txt)
          {
            echo '## Crypto test coverage (combined native backends)';
            echo '';
            echo "**Overall:** ${line_coverage} lines, ${region_coverage} regions, ${function_coverage} functions";
            echo '';
            echo '<details open>';
            echo '<summary>Per-file coverage</summary>';
            echo '';
            echo '```';
            cat crypto-coverage-summary.txt;
            echo '```';
            echo '';
            echo '</details>';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: crypto-coverage-reports
          path: |
            crypto-lcov-combined.info
            crypto-coverage-summary.txt
